; ============================================================================
; Leek BTC Signer - ESP32-S3-WROOM-1-N16R8 CAM + OV5640
;
; Environments (see ROADMAP.md T0):
;   s3cam        the board, release shape: no console, no radios
;   s3cam-dev    the board with a USB-Serial-JTAG console and logs
;   s3cam-qemu   Espressif QEMU: UART0 console, no PSRAM, test harness
;
; Every environment sets the sdkconfig defaults list on BOTH
; board_build.sdkconfig_defaults and -DSDKCONFIG_DEFAULTS. LeekWallet found
; that setting only one silently drops the override and still reports a
; successful build.
; ============================================================================

[env]
; Pinned, not floating: a different espressif32 release brings a different
; ESP-IDF and compiler, and reproducible builds stop matching.
; 6.12.0 == ESP-IDF 5.5.0, toolchain 14.2.0, same as LeekWallet.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
upload_speed = 921600
upload_protocol = esptool
upload_flags =
    --before=default_reset
    --after=hard_reset
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:s3cam]
build_flags =
    -DLBS_BOARD_S3CAM=1
    -DLBS_DISPLAY_OLED128=1
board_build.sdkconfig_defaults = sdkconfig.defaults;config/sdkconfig.s3cam;config/sdkconfig.release
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;config/sdkconfig.s3cam;config/sdkconfig.release"

[env:s3cam-dev]
build_flags =
    -DLBS_BOARD_S3CAM=1
    -DLBS_DISPLAY_OLED128=1
    -DLBS_DEV_BUILD=1
board_build.sdkconfig_defaults = sdkconfig.defaults;config/sdkconfig.s3cam
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;config/sdkconfig.s3cam"

; QEMU has no PSRAM model (espressif/qemu#129) and no USB-Serial-JTAG, so
; this environment leaves config/sdkconfig.s3cam out and routes the console to UART0.
; Nothing built here may be flashed to a board that will hold a seed.
[env:s3cam-qemu]
build_flags =
    -DLBS_BOARD_S3CAM=1
    -DLBS_DISPLAY_OLED128=1
    -DLBS_QEMU=1
    -DLBS_QEMU_HARNESS=1
board_build.sdkconfig_defaults = sdkconfig.defaults;config/sdkconfig.qemu
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;config/sdkconfig.qemu"
upload_protocol = custom

; Self-test image (T21): the host's vector suites compiled into the QEMU
; firmware and run at boot, so the Bitcoin code is proven on the Xtensa
; build too. scripts/qemu.sh --env s3cam-qemu-selftest --selftest
[env:s3cam-qemu-selftest]
build_flags =
    -DLBS_BOARD_S3CAM=1
    -DLBS_DISPLAY_OLED128=1
    -DLBS_QEMU=1
    -DLBS_SELFTEST=1
board_build.sdkconfig_defaults = sdkconfig.defaults;config/sdkconfig.qemu
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;config/sdkconfig.qemu"
    -DLBS_SELFTEST=1
upload_protocol = custom
